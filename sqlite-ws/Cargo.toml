[package]
name = "sqlite-ws"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.9.0"
actix-web-actors = "4.3.0"
actix = "0.13.3"
actix-files = "0.6.5"
tokio = { version = "1.36.0", features = ["full"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
derive_more = { version = "2.0.1", features = ["full"] }
base64 = "0.22.0"
parking_lot = "0.12.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.26.0"
